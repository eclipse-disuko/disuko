name: Upload Backend SBOM to Dependency Track

on:
  push:
    branches:
      - main
    paths:
      - 'backend/go.mod'
      - 'backend/go.sum'
  workflow_dispatch:
    inputs:
      project_version:
        description: >
          Version label to create in Dependency Track.
          Leave empty to use the current commit SHA.
        required: false
        type: string
      upload:
        description: >
          Whether to upload the SBOM to Dependency Track.
        required: false
        type: boolean
        default: true

permissions:
  id-token: write

jobs:
  sbom-upload:
    name: Generate and Upload SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: 'backend/go.sum'

      - name: Determine project version
        id: version
        # Use the explicit input when provided, fall back to the full commit SHA.
        run: |
          if [ -n "${{ inputs.project_version }}" ]; then
            echo "value=${{ inputs.project_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cyclonedx-gomod
        # Pin to the same tool version used to generate the committed SBOMs.
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-gomod app \
            -main . \
            -json \
            -output sbom.cyclonedx.json
        working-directory: backend

      - uses: eclipse-csi/workflows/upload-sbom@d2d3dbbc0a1907f41892c1698b3c6353235c87cb # releases do not exist - 2026-11-18
        if: ${{ github.event_name == 'push' || inputs.upload }}
        with:
          sbom-file: 'backend/sbom.cyclonedx.json'
          product-name: 'disuko-backend'
          product-version: ${{ steps.version.outputs.value }}

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.version.outputs.value }}
          path: backend/sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 90

